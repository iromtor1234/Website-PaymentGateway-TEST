<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRIZ MULTI-PAY - ANTI SIMULATION 👹</title>
    <style>
        body { background: #050505; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #111; border: 1px solid #222; padding: 30px; border-radius: 20px; width: 400px; box-shadow: 0 0 40px rgba(59, 130, 246, 0.15); border-top: 4px solid #3b82f6; }
        h2 { text-align: center; color: #3b82f6; text-transform: uppercase; letter-spacing: 3px; margin-bottom: 25px; }
        label { font-size: 11px; color: #666; font-weight: bold; text-transform: uppercase; margin-left: 5px; }
        input, select { width: 100%; padding: 14px; margin: 8px 0 18px 0; background: #000; border: 1px solid #333; color: #fff; border-radius: 12px; transition: 0.3s; }
        input:focus, select:focus { border-color: #3b82f6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.3); outline: none; }
        button { width: 100%; padding: 16px; background: #3b82f6; border: none; color: #fff; font-weight: bold; border-radius: 12px; cursor: pointer; transition: 0.3s; font-size: 14px; }
        button:hover { background: #2563eb; transform: translateY(-2px); box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3); }
        #status { margin-top: 20px; font-size: 10px; color: #444; text-align: center; font-family: monospace; border-top: 1px solid #222; padding-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>BRIZ MULTI-PAY 💸</h2>
        
        <label>Nama Pembayar</label>
        <input type="text" id="nama" placeholder="Siapa nama lu, cuy?">

        <label>Nominal Transfer (IDR)</label>
        <input type="number" id="nominal" placeholder="Minimal 10000">

        <label>Pilih Metode Pembayaran</label>
        <select id="metode">
            <optgroup label="QRIS & E-Wallet">
                <option value="qris">QRIS (All Payment)</option>
                <option value="dana">DANA</option>
                <option value="ovo">OVO</option>
                <option value="gopay">GOPAY</option>
                <option value="linkaja">LINKAJA</option>
                <option value="shopeepay">SHOPEEPAY</option>
            </optgroup>
            <optgroup label="Virtual Account (VA)">
                <option value="bca">BCA Virtual Account</option>
                <option value="bni">BNI Virtual Account</option>
                <option value="bri">BRI Virtual Account</option>
                <option value="mandiri">MANDIRI Virtual Account</option>
                <option value="permata">PERMATA Virtual Account</option>
            </optgroup>
            <optgroup label="Retail Outlet">
                <option value="alfamart">ALFAMART</option>
                <option value="indomaret">INDOMARET</option>
            </optgroup>
        </select>

        <button onclick="gaspolBayar()">BAYAR SEKARANG 🔥</button>
        <div id="status">STATUS: STANDBY // ANTI-SIMULATION V4</div>
    </div>

    <script>
        async function gaspolBayar() {
            const status = document.getElementById('status');
            const apiKey = "120|YtiYSWe9fvevGpiHN17jE9xU3eirbAX7n8w13Evv5ba579c6"; // API KEY LU 💀
            
            const payload = {
                nominal: document.getElementById('nominal').value,
                nama_pembayar: document.getElementById('nama').value,
                metode: document.getElementById('metode').value,
                external_id: "BRIZ-ORDER-" + Math.floor(Date.now() / 1000)
            };

            if (!payload.nama_pembayar || !payload.nominal) {
                alert("Isi dulu datanya, bangsat! Jangan kosong kayak dompet lu! 😭💀");
                return;
            }

            status.innerText = "NEMBAK API TASKORA... 🚀";

            try {
                const response = await fetch('https://bayar.taskora.id/api/orders?sandbox=true', {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + apiKey,
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                const res = await response.json();
                console.log(res);

                if (res.status === 'success' || res.data) {
                    status.innerText = "W! REDIRECTING...";
                    window.location.href = res.data.checkout_url;
                } else {
                    status.innerText = "GAGAL! " + (res.message || "CEK CONSOLE");
                    alert("Gagal: " + (res.message || "Cek console browser lu!"));
                }
            } catch (err) {
                status.innerText = "L! KENA CORS ATAU CONNECTION ERROR 😭";
                console.error(err);
                alert("CORS ERROR! Lu wajib upload ke hosting atau pake local server (PHP) biar jalan, jing!");
            }
        }
    </script>
</body>
</html>
