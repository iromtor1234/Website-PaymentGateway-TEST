<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BRIZ MULTI-PAY V4 👹</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>BRIZ PAY 💸</h2>
        
        <div class="form-group">
            <label>Nama Pembayar</label>
            <input type="text" id="nama" placeholder="Siapa nama lu, cuy?">
        </div>

        <div class="form-group">
            <label>Nominal (IDR)</label>
            <input type="number" id="nominal" placeholder="Minimal 10000">
        </div>

        <div class="form-group">
            <label>Metode Pembayaran</label>
            <select id="metode">
                <optgroup label="QRIS & E-Wallet">
                    <option value="qris">QRIS (All Payment)</option>
                    <option value="dana">DANA</option>
                    <option value="ovo">OVO</option>
                </optgroup>
                <optgroup label="Virtual Account">
                    <option value="bca">BCA Virtual Account</option>
                    <option value="bni">BNI Virtual Account</option>
                    <option value="mandiri">MANDIRI Virtual Account</option>
                </optgroup>
            </select>
        </div>

        <button onclick="gaspolBayar()">BAYAR SEKARANG 🔥</button>
        <div id="status">STATUS: STANDBY // ANTI-SIMULATION</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
